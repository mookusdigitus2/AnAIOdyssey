name: AnAIOdyssey
options:
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig

settings:
  base:
    EXCLUDED_ARCHS[sdk=macosx*]: x86_64

packages:
  AnAIOdysseyCore:
    path: Packages/AnAIOdysseyCore
  AnAIOdysseyAI:
    path: Packages/AnAIOdysseyAI
  AnAIOdysseyMail:
    path: Packages/AnAIOdysseyMail
  AnAIOdysseyUI:
    path: Packages/AnAIOdysseyUI
  AIConnect:
    path: ../AIConnect/AIConnect
  AIConnectVoice:
    path: ../AIConnectVoice

targets:
  AnAIOdyssey:
    type: application
    supportedDestinations: [macOS, iOS]
    sources:
      - path: AnAIOdysseyApp
      - path: Assets.xcassets
      - path: Fixtures/Mail
        buildPhase: resources
        type: folder
      # Settings > About > Acknowledgements (generated by
      # Scripts/generate_third_party_notices.py).
      - path: ThirdPartyNotices
        buildPhase: resources
        type: folder
    dependencies:
      - package: AnAIOdysseyCore
      - package: AnAIOdysseyAI
      - product: AnAIOdysseyMLX
        package: AnAIOdysseyAI
      - package: AnAIOdysseyMail
      - package: AnAIOdysseyUI
    # xcodegen REGENERATES this file on every `xcodegen generate`, so the
    # entitlement keys must live here — a bare `path:` silently empties it.
    entitlements:
      path: AnAIOdyssey.entitlements
      properties:
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.icloud-container-identifiers:
          - iCloud.$(BUNDLE_ID_PREFIX).anaiodyssey.app
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)$(CFBundleIdentifier)
        aps-environment: development
        com.apple.developer.aps-environment: development
    info:
      path: AnAIOdysseyApp/Info.plist
      properties:
        # Tie versions to build settings; otherwise xcodegen hardcodes 1.0/1.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Project homepage for AI attribution headers; set in Config/Signing.xcconfig.
        PROJECT_HOMEPAGE_URL: $(PROJECT_HOMEPAGE_URL)
        NSUserNotificationsUsageDescription: "An AI Odyssey sends reminders when scheduled tasks are due."
        NSPhotoLibraryUsageDescription: "An AI Odyssey imports photos from your library and saves generated images to an “AI Generated” album."
        NSPhotoLibraryAddUsageDescription: "An AI Odyssey saves AI-generated images to your Photos library."
        UIBackgroundModes:
          - audio
          - remote-notification
    attributes:
      SystemCapabilities:
        com.apple.iCloud:
          enabled: 1
          versions:
            - CloudKit
        com.apple.Push:
          enabled: 1
    settings:
      PRODUCT_NAME: "An AI Odyssey"
      PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).anaiodyssey
      GENERATE_INFOPLIST_FILE: YES
      MARKETING_VERSION: "0.5"
      CURRENT_PROJECT_VERSION: "47"
      SWIFT_VERSION: "5.9"
      # DEVELOPMENT_TEAM comes from Config/Signing.xcconfig (blank by default).
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_IDENTITY: "Apple Development"
      CODE_SIGN_ENTITLEMENTS: AnAIOdyssey.entitlements
      # macOS builds must be sandboxed for Mac App Store / TestFlight distribution.
      CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: AnAIOdyssey.macOS.entitlements
      ENABLE_HARDENED_RUNTIME: YES
      INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.productivity"
      SUPPORTS_MACCATALYST: NO
      SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
      SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: YES
      CODE_SIGNING_ALLOWED: YES
      INFOPLIST_KEY_CFBundleDisplayName: "An AI Odyssey"
      INFOPLIST_KEY_CFBundleName: "An AI Odyssey"
      INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: "An AI Odyssey needs calendar access to show and create events."
      INFOPLIST_KEY_NSMicrophoneUsageDescription: "An AI Odyssey uses the microphone for voice chat input."
      INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "An AI Odyssey saves AI-generated images to your Photos library."
      INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "An AI Odyssey imports photos from your library and saves generated images to an “AI Generated” album."
      INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "An AI Odyssey transcribes your speech for voice chat."
      INFOPLIST_KEY_NSUserNotificationsUsageDescription: "An AI Odyssey sends reminders when scheduled tasks are due."
      INFOPLIST_FILE: AnAIOdysseyApp/Info.plist
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
      INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
      INFOPLIST_KEY_UIBackgroundModes: audio remote-notification
      TARGETED_DEVICE_FAMILY: "1,2"

  AnAIOdysseyCoreTests:
    type: bundle.unit-test
    supportedDestinations: [macOS, iOS]
    sources:
      - path: AnAIOdysseyCoreTests
    dependencies:
      - product: AIConnect
        package: AIConnect
      - product: AIConnectVoice
        package: AIConnectVoice
      - product: AIConnectUI
        package: AIConnect
      - package: AnAIOdysseyCore
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).anaiodyssey.core-tests
      GENERATE_INFOPLIST_FILE: YES
      CODE_SIGN_IDENTITY: "-"
      CODE_SIGNING_ALLOWED: NO

  AnAIOdysseyAITests:
    type: bundle.unit-test
    supportedDestinations: [macOS, iOS]
    sources:
      - path: AnAIOdysseyAITests
    dependencies:
      - product: AIConnect
        package: AIConnect
      - product: AIConnectVoice
        package: AIConnectVoice
      - product: AIConnectUI
        package: AIConnect
      - package: AnAIOdysseyAI
      - product: AnAIOdysseyMLX
        package: AnAIOdysseyAI
      - package: AnAIOdysseyCore
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).anaiodyssey.ai-tests
      GENERATE_INFOPLIST_FILE: YES
      CODE_SIGN_IDENTITY: "-"
      CODE_SIGNING_ALLOWED: NO
      INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: YES

  AnAIOdysseyMailTests:
    type: bundle.unit-test
    supportedDestinations: [macOS, iOS]
    sources:
      - path: AnAIOdysseyMailTests
      - path: Fixtures/Mail
        buildPhase: resources
        type: folder
    dependencies:
      - product: AIConnect
        package: AIConnect
      - product: AIConnectVoice
        package: AIConnectVoice
      - product: AIConnectUI
        package: AIConnect
      - package: AnAIOdysseyMail
      - package: AnAIOdysseyAI
      - package: AnAIOdysseyCore
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).anaiodyssey.mail-tests
      GENERATE_INFOPLIST_FILE: YES
      CODE_SIGN_IDENTITY: "-"
      CODE_SIGNING_ALLOWED: NO

  AnAIOdysseyIntegrationTests:
    type: bundle.unit-test
    supportedDestinations: [macOS]
    sources:
      - path: AnAIOdysseyIntegrationTests
    dependencies:
      - product: AIConnect
        package: AIConnect
      - product: AIConnectVoice
        package: AIConnectVoice
      - product: AIConnectUI
        package: AIConnect
      - package: AnAIOdysseyCore
      - package: AnAIOdysseyAI
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).anaiodyssey.integration-tests
      GENERATE_INFOPLIST_FILE: YES
      CODE_SIGN_IDENTITY: "-"
      CODE_SIGNING_ALLOWED: NO
      TEST_HOST: ""

  AnAIOdysseyUITests:
    type: bundle.ui-testing
    supportedDestinations: [macOS, iOS]
    sources:
      - path: AnAIOdysseyUITests
    dependencies:
      - product: AIConnect
        package: AIConnect
      - product: AIConnectVoice
        package: AIConnectVoice
      - product: AIConnectUI
        package: AIConnect
      - target: AnAIOdyssey
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).anaiodyssey.ui-tests
      GENERATE_INFOPLIST_FILE: YES
      CODE_SIGN_IDENTITY: "-"
      CODE_SIGNING_ALLOWED: YES
      CODE_SIGNING_REQUIRED: NO

schemes:
  AnAIOdyssey:
    build:
      targets:
        AnAIOdyssey: all
    test:
      targets:
        - AnAIOdysseyCoreTests
        - AnAIOdysseyAITests
        - AnAIOdysseyMailTests
        - AnAIOdysseyIntegrationTests
        - AnAIOdysseyUITests
    run:
      config: Debug
