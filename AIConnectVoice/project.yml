# SPDX-License-Identifier: MIT
# Standalone Xcode project for AIConnectVoice. Generate with
# `xcodegen generate`. Package.swift remains the source of truth; this project
# compiles the same sources as a framework and runs the same tests.
name: AIConnectVoice
options:
  bundleIdPrefix: com.example.aiconnect
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_TESTABILITY: YES

packages:
  AIConnect:
    path: ../AIConnect/AIConnect
  AIModelOptions:
    path: ../AIConnect/AIModelOptions

targets:
  AIConnectVoice:
    type: framework
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Sources/AIConnectVoice
    dependencies:
      - package: AIConnect
        product: AIConnect
      - package: AIModelOptions
        product: AIModelOptions
      - sdk: Speech.framework
  AIConnectVoiceTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Tests/AIConnectVoiceTests
    dependencies:
      # AIConnect and AIModelOptions are linked into the framework; the test
      # bundle reaches them through it, so it doesn't link them twice.
      - target: AIConnectVoice

schemes:
  AIConnectVoice:
    build:
      targets:
        AIConnectVoice: all
    test:
      targets:
        - AIConnectVoiceTests
